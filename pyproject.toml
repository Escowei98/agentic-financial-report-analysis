[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "agentic-financial-report-analysis"
version = "0.1.0"
description = "Comparative evaluation of 4 RAG architectures on SEC 10-K filings"
requires-python = ">=3.12"
dependencies = [
    # LangChain ecosystem
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    # Google Gemini
    "google-genai>=1.0",
    # SEC EDGAR data access
    "edgartools>=3.0",
    # Vector store
    "chromadb>=0.5",
    # Evaluation
    "ragas>=0.2",
    # Configuration & environment
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "jupyter>=1.0", "ipykernel>=6.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true