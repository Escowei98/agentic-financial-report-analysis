# System 1: Simple RAG (Monolith) — Chunking + Hybrid Retrieval + Reranking
chunking:
  strategy: "recursive" # RecursiveCharacterTextSplitter
  chunk_size: 2000 # Optuna best value
  chunk_overlap_pct: 0.10 # Optuna best value

retrieval:
  mode: "hybrid" # BM25 + Dense (EnsembleRetriever)
  bm25_weight: 0.3 # Optuna best value
  dense_weight: 0.7 # = 1 - bm25_weight
  pre_rerank_top_k: 15 # Optuna best value
  post_rerank_top_k: 5 # Optuna best value

reranker:
  enabled: true
  provider: "flashrank"
  model: "ms-marco-MiniLM-L-12-v2"

vectorstore:
  provider: "chromadb"
  persist_directory: "data/vectorstores/rag_monolith"
  collection_name: "sec_10k_filings"
