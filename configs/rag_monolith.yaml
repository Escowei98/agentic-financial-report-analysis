# System 1: Simple RAG (Monolith) — Chunking + Hybrid Retrieval + Reranking
chunking:
  strategy: "recursive"       # RecursiveCharacterTextSplitter
  chunk_size: 1000            # Optuna: [1000..2000, step=500]
  chunk_overlap_pct: 0.20     # Optuna: [0.10, 0.20] → overlap = chunk_size * pct

retrieval:
  mode: "hybrid"              # BM25 + Dense (EnsembleRetriever)
  bm25_weight: 0.3            # Optuna: [0.3..0.7, step=0.2]
  dense_weight: 0.7           # = 1 - bm25_weight
  pre_rerank_top_k: 20        # Optuna: [15..25, step=5]
  post_rerank_top_k: 5        # Optuna: [3..8]

reranker:
  enabled: true
  provider: "flashrank"
  model: "ms-marco-MiniLM-L-12-v2"

vectorstore:
  provider: "chromadb"
  persist_directory: "data/vectorstores/rag_monolith"
  collection_name: "sec_10k_filings"
